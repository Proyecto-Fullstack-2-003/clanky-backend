

server:
  port: ${PORT:8083}

spring:
  application:
    name: carrito
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  swagger-url: http://localhost:8083
  issuer: ${JWT_ISSUER:clanky-usuarios}
  jwks: ${AUTH_JWKS_URL:http://localhost:8081/api/auth/jwks}
  catalogo-url: ${CATALOGO_URL:http://localhost:8082}
  internal-key: ${INTERNAL_API_KEY:local-cambiar-clave-interna-32-caracteres}
