
server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: http://usuarios:8081
              predicates:
                - Path=/api/auth/**

            - id: catalogo
              uri: http://catalogo:8082
              predicates:
                - Path=/api/productos/**

            - id: carrito
              uri: http://carrito:8083
              predicates:
                - Path=/api/v1/carrito/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only